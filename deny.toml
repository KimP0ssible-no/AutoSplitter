# cargo-deny: known vulnerabilities, licences and crate sources.
#   cargo deny check

[graph]
# What ships, as in about.toml; Linux only for development builds.
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]
exclude-dev = true

[advisories]
# Only a direct dependency going unmaintained is ours to act on.
unmaintained = "workspace"
ignore = [
    # chrono is unmaintained, with no maintained release. Slint needs it, so it
    # stays in the build whatever AutoSplitter itself uses.
    { id = "RUSTSEC-2026-0543", reason = "Slint depends on chrono; no maintained release" },
]

[licenses]
# Keep in step with `accepted` in about.toml.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "GPL-3.0-only",
]

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
