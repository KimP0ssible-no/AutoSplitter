# cargo-about: the licences AutoSplitter's dependencies may use. Generate the
# notices with `cargo about generate about.hbs -o target/THIRD-PARTY-NOTICES.html`.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "GPL-3.0-only",
]
# Only what ships.
targets = ["x86_64-pc-windows-msvc"]
ignore-build-dependencies = false
ignore-dev-dependencies = true
