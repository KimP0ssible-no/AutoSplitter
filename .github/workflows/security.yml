name: Security

# Each night: advisories. The code does not change overnight but the advisory
# database does, so a failure can mean a shipped release depends on a
# vulnerable crate. By hand: workflow_dispatch.
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command-arguments: advisories
