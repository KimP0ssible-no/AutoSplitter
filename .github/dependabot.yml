version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        update-types: [minor, patch]
    ignore:
      # ort is a release candidate pinned with =; it moves by hand, together
      # with the ONNX Runtime notices in packaging/notices/.
      - dependency-name: ort
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
